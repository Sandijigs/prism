# ── PRISM CRE Secrets ──────────────────────────────────────────────────
#
# Copy this file to secrets.yaml and fill in your actual values.
# NEVER commit secrets.yaml to version control.
#
# In production CRE, these values are injected via the platform's
# encrypted secrets store and are only accessible inside DON TEEs.
# ──────────────────────────────────────────────────────────────────────

# LLM API key for AI risk analysis (Gemini)
llmApiKey: "YOUR_LLM_API_KEY_HERE"

# RPC URL for the target EVM chain
chainRpcUrl: "https://your-rpc-url.example.com"

# World ID API key (optional — leave empty for mock mode)
worldIdApiKey: ""

# Private key for signing transactions (CRE DON manages this in production)
signerPrivateKey: "0x_YOUR_PRIVATE_KEY_HERE"
